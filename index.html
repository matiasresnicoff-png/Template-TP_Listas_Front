<form id="formAgregar">
  <div>
    <label for="nombre">Nombre:</label>
    <input type="text" id="nombre" name="nombre" required>
  </div>

  <div>
    <label for="categoria">Categoría:</label>
    <select id="categoria" name="categoria" required>
      <option value="">Selecciona una categoría</option>
      <option value="Entrada">Entrada</option>
      <option value="Plato Principal">Plato Principal</option>
      <option value="Postre">Postre</option>
    </select>
  </div>

  <div>
    <label for="provincia">Provincia:</label>
    <select id="provincia" name="provincia" required>
      <option value="">Selecciona una provincia</option>
      <option value="Buenos Aires">Buenos Aires</option>
      <option value="Mendoza">Mendoza</option>
      <option value="Córdoba">Córdoba</option>
      <option value="Salta">Salta</option>
    </select>
  </div>

  <div>
    <label for="ingredientes">Ingredientes (separados por coma):</label>
    <input type="text" id="ingredientes" name="ingredientes" required>
  </div>

  <button type="submit">Agregar Comida</button>
</form>

<div>
  <label for="filtroProvincia">Filtrar por provincia:</label>
  <select id="filtroProvincia">
    <option value="">Todas las provincias</option>
    <option value="Buenos Aires">Buenos Aires</option>
    <option value="Mendoza">Mendoza</option>
    <option value="Córdoba">Córdoba</option>
    <option value="Salta">Salta</option>
  </select>
</div>

<div id="comidaContainer"></div>
