<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comidas Argentinas</title> 
    <link rel="stylesheet" href="style.css"> 
</head>
<body>
    <header>
      <div class="filtros">
        <!-- Buscador Triple (Nombre, Categoría o Provincia) -->
        <label for="buscador">Buscar:</label>
        <input type="text" id="buscador" placeholder="Ej: Asado, Parrilla o Salta">
        <button id="btnBuscar" type="button">Buscar</button>

        <!-- Filtros desplegables existentes -->
        <label for="filtroCategoria">Categoría:</label>
        <select id="filtroCategoria">
          <option value="">Todas las categorías</option>
        </select>
        <button id="btnFiltroCategoria" type="button">Filtrar por categoría</button>

        <label for="filtroProvincia">Provincia:</label>
        <select id="filtroProvincia">
          <option value="">Todas las provincias</option>
        </select>
        <button id="btnFiltroProvincia" type="button">Filtrar por provincia</button>

        <button id="btnMostrarTodos" type="button">Mostrar todos</button>
      </div>
    </header>

    <main class="comida-container" id="comidaContainer">
    </main>     

    <section class="addFood">
      <form id="formAgregar">

        <label for="nombre">Nombre de la comida</label>
        <input type="text" id="nombre" name="nombre" placeholder="Ej: Asado" required>

        <label for="categoria">Tipo de comida</label>
        <input type="text" id="categoria" name="categoria" placeholder="Ej: Parrilla" required>

        <label for="provincia">Provincia</label>
        <input type="text" id="provincia" name="provincia" placeholder="Ej: Tucumán" required>

        <label for="ingredientes">Ingredientes</label>
        <input type="text" id="ingredientes" name="ingredientes" placeholder="Ej: Carne, Sal, Chimichurri" required>

        <button type="submit">Agregar comida</button>

      </form>
    </section>

    <script type="module" src="./main.js"></script>
</body>
</html>
