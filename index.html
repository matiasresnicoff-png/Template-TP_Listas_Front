<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comidas Argentinas</title> 
    <link rel="stylesheet" href="style.css"> 
</head>
<body>
    <header>
      <!-- Para filtros y navegacion -->
    </header>

    <main class="comida-container" id="comidaContainer">
        <!-- Contenido Dinamico -->
    </main>     

    <section class="addFood">
      <form id="formAgregar">
    
        <label for="nombre">Nombre de la comida</label>
        <input type="text" id="nombre" placeholder="Ej: Asado">
    
        <label for="categoria">Tipo de comida</label>
        <input type="text" id="categoria" placeholder="Ej: Parrilla">
    
        <label for="provincia">Provincia</label>
        <input type="text" id="provincia" placeholder="Ej: Buenos Aires">
    
        <button type="submit">Agregar comida</button>
    
      </form>
    </section>

    <script type="module" src="./main.js"></script>
</body>
</html>
