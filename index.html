<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comidas Argentinas</title> 
    <link rel="stylesheet" href="style.css"> 
</head>
<body>
    <header>
      <div class="filtros">
        <div>
          <label for="buscador">Buscar:</label>
          <input type="text" id="buscador" placeholder="Ej: Asado, Parrilla o Salta">
          <button id="btnBuscar" type="button">Buscar</button>
        </div>

        <div>
          <label for="filtroCategoria">Categoría:</label>
          <select id="filtroCategoria">
            <option value="">Todas las categorías</option>
          </select>
          <button id="btnFiltroCategoria" type="button">Filtrar por categoría</button>
        </div>

        <div>
          <label for="filtroProvincia">Provincia:</label>
          <select id="filtroProvincia">
            <option value="">Todas las provincias</option>
          </select>
          <button id="btnFiltroProvincia" type="button">Filtrar por provincia</button>
        </div>

        <div>
          <button id="btnMostrarTodos" type="button">Mostrar todos</button>
        </div>
      </div>
    </header>

    <main class="comida-container" id="comidaContainer">
        <!-- Contenido Dinamico -->
    </main>     

    <section class="addFood">
      <h2>Agregar Comida</h2>
      <form id="formAgregar">

        <label for="nombre">Nombre de la comida:</label>
        <input type="text" id="nombre" name="nombre" placeholder="Nombre de la comida">

        <label for="provincia">Provincia:</label>
        <input type="text" id="provincia" name="provincia" placeholder="Provincia">

        <label for="categoria">Categoría:</label>
        <input type="text" id="categoria" name="categoria" placeholder="Categoría">

        <label>Ingredientes:</label>
        <div id="contenedorIngredientes" class="grid-ingredientes">
          <input type="text" class="input-ingrediente" placeholder="Un ingrediente por box">
        </div>

        <button type="button" id="btnAgregarIngrediente">Agregar Ingrediente</button>
        <button type="submit">Agregar</button>

      </form>
    </section>

    <script type="module" src="./main.js"></script>
</body>
</html>
